<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RepGrade" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>RepGrade</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Siste skanse: hvis appen ikke klarer å starte, vis en melding i stedet for en mørk skjerm.
      (function () {
        var shown = false;
        function fallback(msg) {
          var root = document.getElementById('root');
          if (shown || !root || root.childElementCount) return;
          shown = true;
          root.innerHTML =
            '<div role="alert" style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#07090a;color:#f2f5f3;font-family:system-ui,sans-serif">' +
            '<div style="max-width:420px"><h1 style="font-size:22px;margin:0 0 8px">RepGrade kunne ikke starte</h1>' +
            '<p style="color:#9aa59f;line-height:1.5">Prøv å laste inn på nytt. Dataene dine er trygge. / The app could not start. Try reloading.</p>' +
            '<p style="color:#5f6964;font-size:13px;word-break:break-word">' + String(msg || '').replace(/</g, '&lt;') + '</p>' +
            '<button onclick="location.reload()" style="min-height:48px;padding:0 20px;border-radius:14px;border:0;background:#f2f2f3;color:#0b0b0c;font-weight:700;font-size:16px">Last inn på nytt / Reload</button></div></div>';
        }
        window.addEventListener('error', function (e) { setTimeout(function () { fallback(e.message); }, 1500); });
        window.addEventListener('unhandledrejection', function (e) { setTimeout(function () { fallback(e.reason && e.reason.message); }, 1500); });
        setTimeout(function () { fallback('Tidsavbrudd ved oppstart / Startup timed out'); }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
